<main class="min-h-dvh bg-surface-50 text-color" role="main">
  <div class="mx-auto max-w-2xl px-4 py-12 sm:px-6">
    <h1 class="text-3xl font-bold tracking-tight text-primary-800">Camunda + Angular</h1>

    <p-card class="mt-8 block" header="Hello API">
      <p class="m-0 mb-4 text-sm leading-relaxed text-muted-color">
        Calls
        <code
          class="rounded border border-surface-300 bg-surface-200 px-1.5 py-0.5 font-mono text-xs text-surface-900 dark:border-surface-600 dark:bg-surface-800 dark:text-surface-50"
        >
          GET /camunda-starter-template/api/hello
        </code>
        via the dev proxy (backend on port 8080).
      </p>

      <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
        <div class="flex min-w-0 flex-1 flex-col gap-2">
          <label class="text-sm font-medium text-color" for="hello-name">Your name</label>
          <input
            id="hello-name"
            type="text"
            pInputText
            class="w-full"
            placeholder="Leave empty for default"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            (keydown.enter)="greet()"
          />
        </div>
        <p-button label="Greet" [loading]="loading()" (onClick)="greet()" />
      </div>

      @if (greeting(); as g) {
        <p class="mt-4 mb-0 rounded-lg border border-primary-200 bg-primary-50 p-4 font-medium text-primary-900">
          {{ g }}
        </p>
      }

      @if (error(); as err) {
        <p class="mt-4 mb-0 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-900" role="alert">
          {{ err }}
        </p>
      }
    </p-card>
  </div>
</main>

<router-outlet />
